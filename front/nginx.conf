# Serves the built SPA and reverse-proxies /api to the backend so the
# browser only ever talks to one origin in production — no CORS
# configuration needed there (CORS_ALLOWED_ORIGINS is a dev-only concern,
# see back/app/core/config.py). Paired with building the frontend image
# with VITE_API_BASE_URL="" (see docker-compose.prod.yml) so the app calls
# relative /api/... URLs that land here.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: any non-file, non-API route (e.g. /traites/<uuid> on a
    # hard refresh) is served index.html and resolved client-side by
    # react-router, instead of a raw 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
