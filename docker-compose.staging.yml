services:
  backend:
    build:
      context: ./back
      target: dev

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${POSTGRES_HOST:-langfuse-postgres-1}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-trait_ai}
      DATABASE_URL_TEST: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${POSTGRES_HOST:-langfuse-postgres-1}:${POSTGRES_PORT:-5432}/${POSTGRES_TEST_DB:-trait_ai_test}

      ENVIRONMENT: development

      CORS_ALLOWED_ORIGINS: http://${APP_HOST:-localhost}:${FRONTEND_PORT:-5174},http://localhost:${FRONTEND_PORT:-5174},http://127.0.0.1:${FRONTEND_PORT:-5174}

      OCR_PROVIDER: ${OCR_PROVIDER:-stub}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-12-01-preview}

    ports:
      - "${BACKEND_PORT:-8002}:8000"

    volumes:
      - ./back:/app
      # Legacy uploads only; retain until BYTEA backfill has been verified.
      - uploads_data:/app/uploads

    networks:
      - app_network
      - langfuse_network

  frontend:
    build:
      context: ./front
      target: dev

    environment:
      VITE_API_BASE_URL: http://${APP_HOST:-localhost}:${BACKEND_PORT:-8002}

    ports:
      - "${FRONTEND_PORT:-5174}:5173"

    volumes:
      - ./front:/app
      - /app/node_modules

    depends_on:
      - backend

    networks:
      - app_network

networks:
  app_network:

  langfuse_network:
    external: true
    name: ${POSTGRES_NETWORK}

volumes:
  uploads_data:
