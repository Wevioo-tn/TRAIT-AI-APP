services:
  postgres:
    image: postgres:16-alpine
    networks:
      - trait-ai-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trait}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trait}
      POSTGRES_DB: ${POSTGRES_DB:-trait_ai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./back/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trait} -d ${POSTGRES_DB:-trait_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./back
      target: dev
    networks:
      - trait-ai-network
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-trait}:${POSTGRES_PASSWORD:-trait}@postgres:5432/${POSTGRES_DB:-trait_ai}
      DATABASE_URL_TEST: postgresql+psycopg://${POSTGRES_USER:-trait}:${POSTGRES_PASSWORD:-trait}@postgres:5432/trait_ai_test
      ENVIRONMENT: development
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}
      OCR_PROVIDER: ${OCR_PROVIDER:-stub}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-08-01-preview}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./back:/app
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./front
      target: dev
    networks:
      - trait-ai-network
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./front:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:

networks:
  trait-ai-network:
    driver: bridge