services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trait}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trait}
      POSTGRES_DB: ${POSTGRES_DB:-trait_ai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./back/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trait} -d ${POSTGRES_DB:-trait_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./back
      # back/Dockerfile is multi-stage now (Sprint 7 hardening); without
      # this, `docker compose build` would silently pick the *last* stage
      # (production — no --reload, no bind-mount-friendly setup) instead.
      target: dev
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-trait}:${POSTGRES_PASSWORD:-trait}@postgres:5432/${POSTGRES_DB:-trait_ai}
      DATABASE_URL_TEST: postgresql+psycopg://${POSTGRES_USER:-trait}:${POSTGRES_PASSWORD:-trait}@postgres:5432/trait_ai_test
      ENVIRONMENT: development
      # Kept in sync with FRONTEND_PORT below — if that's overridden in
      # .env without updating this too, the browser's CORS preflight will
      # fail again exactly like the bug this setting was added to fix.
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}
      # Real OCR/extraction (Sprint 8) — see app/services/vlm_extraction.py.
      # Extraction runs as a FastAPI background task inside this same
      # backend process (Sprint 11 — the separate Celery worker/Redis
      # broker were dropped). Defaults to "stub" — opt in explicitly, never
      # accidentally start billing/routing scans to a real provider.
      OCR_PROVIDER: ${OCR_PROVIDER:-stub}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-08-01-preview}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./back:/app
      # Retained for legacy document reads and BYTEA backfill only.
      # New uploads are stored in PostgreSQL. See docs/document-storage.md.
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./front
      target: dev
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./front:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
